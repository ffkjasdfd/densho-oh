<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff">

<title>過去開催の大会 | 伝承王</title>
<meta name="description" content="伝承王で過去に開催された大会の一覧">
<link rel="icon" type="image/png" href="/logo.png">

<style>
:root {
  --bg:#fff;
  --text:#202020;
  --muted:#777;
  --line:#e5e5e5;
  --soft:#f8f8f8;
}

* {
  box-sizing:border-box;
}

html {
  scrollbar-gutter:stable;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  line-height:1.9;
}


/* ==================================================
   ヘッダー
================================================== */

header {
  position:sticky;
  top:0;
  z-index:20;
  height:100px;
  padding:0 32px;
  background:rgba(255,255,255,.98);
  border-bottom:1px solid var(--line);
}

.header-inner {
  position:relative;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  width:min(1200px,100%);
  height:100%;
  margin:auto;
}

.header-title {
  min-width:0;
  text-align:center;
}

.header-title a {
  color:inherit;
  text-decoration:none;
}

.header-title h1 {
  margin:0;
  font-family:"Yu Mincho","Noto Serif JP",serif;
  font-size:34px;
  line-height:1.3;
  letter-spacing:.12em;
}

.header-title .subtitle {
  color:var(--muted);
  font-family:Georgia,serif;
  font-size:11px;
  line-height:1.5;
  letter-spacing:.12em;
}


/* ==================================================
   メニューボタン
================================================== */

.menu-button {
  justify-self:start;
  position:relative;
  width:44px;
  height:44px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}

.menu-button span {
  position:absolute;
  left:11px;
  width:22px;
  height:2px;
  background:#222;
  transition:
    transform .2s ease,
    opacity .2s ease,
    top .2s ease;
}

.menu-button span:nth-child(1) {
  top:14px;
}

.menu-button span:nth-child(2) {
  top:21px;
}

.menu-button span:nth-child(3) {
  top:28px;
}

.menu-button.open span:nth-child(1) {
  top:21px;
  transform:rotate(45deg);
}

.menu-button.open span:nth-child(2) {
  opacity:0;
}

.menu-button.open span:nth-child(3) {
  top:21px;
  transform:rotate(-45deg);
}


/* ==================================================
   HOME・X
================================================== */

.header-actions {
  justify-self:end;
  display:flex;
  align-items:center;
  gap:12px;
}

.header-home {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  width:44px;
  min-height:44px;
  color:#111;
  text-decoration:none;
}

.header-home svg {
  width:21px;
  height:21px;
}

.header-home span {
  font-size:9px;
  line-height:1.2;
}

.header-x {
  display:flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  color:#111;
  text-decoration:none;
}

.header-x svg {
  display:block;
  width:24px;
  height:24px;
  fill:currentColor;
}


/* ==================================================
   展開メニュー
================================================== */

.menu-panel {
  position:fixed;
  top:100px;
  left:0;
  z-index:19;
  width:100%;
  padding:30px 70px;
  background:rgba(255,255,255,.98);
  border-top:1px solid #eee;
  box-shadow:0 10px 25px rgba(0,0,0,.08);

  opacity:0;
  visibility:hidden;
  transform:translateY(-10px);

  transition:
    opacity .2s ease,
    transform .2s ease,
    visibility .2s;
}

.menu-panel.open {
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.menu-nav {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  max-width:1180px;
  margin:0 auto;
}

.menu-nav a {
  padding:15px 12px;
  border-bottom:1px solid var(--line);
  color:var(--text);
  text-align:center;
  text-decoration:none;
  font-size:14px;
}

.menu-nav a:hover {
  color:#777;
}


/* ==================================================
   ページタイトル
================================================== */

.page-heading {
  display:flex;
  min-height:310px;
  padding:70px 24px;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--line);
  text-align:center;
}

.page-label {
  margin:0 0 7px;
  color:var(--muted);
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:.18em;
}

.page-heading h2 {
  margin:0;
  font-family:"Yu Mincho","Noto Serif JP",serif;
  font-size:clamp(28px,5vw,38px);
  font-weight:500;
  letter-spacing:.12em;
}


/* ==================================================
   過去大会一覧
================================================== */

.archive-section {
  width:min(880px,calc(100% - 40px));
  margin:auto;
  padding:70px 0 110px;
}

.archive-list {
  display:flex;
  flex-direction:column;
  gap:22px;
}


/* ==================================================
   大会カード
================================================== */

.tournament-card {
  display:grid;
  grid-template-columns:185px minmax(0,1fr);
  min-height:220px;
  padding:24px;
  border:1px solid #d9d9d9;
  background:#fff;
  color:var(--text);
  text-decoration:none;

  transition:
    border-color .2s ease,
    background .2s ease,
    transform .2s ease;
}

.tournament-card:hover {
  border-color:#999;
  background:#fafafa;
}

.tournament-logo {
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  padding:15px 26px 15px 10px;
  border-right:1px solid var(--line);
}

.tournament-logo img {
  display:block;
  width:100%;
  max-width:125px;
  max-height:130px;
  object-fit:contain;
}

.tournament-info {
  display:flex;
  min-width:0;
  padding:4px 16px 4px 28px;
  flex-direction:column;
  justify-content:center;
}

.tournament-number {
  margin:0 0 4px;
  color:#666;
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:.12em;
}

.tournament-info h3 {
  margin:0;
  font-family:"Yu Mincho","Noto Serif JP",serif;
  font-size:25px;
  font-weight:500;
  letter-spacing:.06em;
}

.tournament-date {
  margin:15px 0 0;
  color:#777;
  font-size:13px;
  line-height:1.9;
}

.date-label {
  display:inline-block;
  width:38px;
  color:#777;
}

.tournament-link {
  align-self:flex-start;
  display:inline-block;
  margin-top:17px;
  padding-bottom:2px;
  border-bottom:1px solid #999;
  color:#222;
  font-size:12px;
}

.card-arrow {
  display:inline-block;
  margin-left:6px;
  transition:transform .2s ease;
}

.tournament-card:hover .card-arrow {
  transform:translateX(4px);
}


/* ==================================================
   フッター
================================================== */

footer {
  padding:30px 20px;
  border-top:1px solid var(--line);
  color:var(--muted);
  text-align:center;
  font-size:11px;
}

footer p {
  margin:4px 0;
}

footer a {
  color:inherit;
  text-decoration:none;
}

footer a:hover {
  color:var(--text);
}


/* ==================================================
   スマートフォン
================================================== */

@media (max-width:600px) {

  header {
    height:78px;
    padding:0 14px;
  }

  .header-inner {
    grid-template-columns:44px minmax(0,1fr) auto;
  }

  .header-title h1 {
    font-size:25px;
    letter-spacing:.08em;
  }

  .header-title .subtitle {
    font-size:8px;
    letter-spacing:.04em;
  }

  .menu-button {
    width:36px;
    height:36px;
  }

  .menu-button span {
    left:7px;
  }

  .menu-button span:nth-child(1) {
    top:11px;
  }

  .menu-button span:nth-child(2) {
    top:17px;
  }

  .menu-button span:nth-child(3) {
    top:23px;
  }

  .menu-button.open span:nth-child(1) {
    top:17px;
  }

  .menu-button.open span:nth-child(3) {
    top:17px;
  }

  .header-actions {
    gap:5px;
  }

  .header-home {
    width:36px;
    min-height:36px;
  }

  .header-home svg {
    width:19px;
    height:19px;
  }

  .header-x {
    width:32px;
    height:36px;
  }

  .header-x svg {
    width:20px;
    height:20px;
  }


  /* メニュー */

  .menu-panel {
    top:78px;
    padding:20px;
  }

  .menu-nav {
    grid-template-columns:1fr;
    gap:0;
  }

  .menu-nav a {
    padding:14px 8px;
    font-size:13px;
  }


  /* ページタイトル */

  .page-heading {
    min-height:240px;
    padding:55px 20px;
  }

  .page-label {
    font-size:10px;
  }


  /* 大会一覧 */

  .archive-section {
    width:calc(100% - 24px);
    padding:45px 0 70px;
  }

  .archive-list {
    gap:16px;
  }


  /* 大会カード */

  .tournament-card {
    grid-template-columns:105px minmax(0,1fr);
    min-height:175px;
    padding:16px 12px;
  }

  .tournament-logo {
    padding:10px 14px 10px 2px;
  }

  .tournament-logo img {
    max-width:85px;
    max-height:100px;
  }

  .tournament-info {
    padding:3px 3px 3px 16px;
  }

  .tournament-number {
    font-size:9px;
  }

  .tournament-info h3 {
    font-size:19px;
  }

  .tournament-date {
    margin-top:10px;
    font-size:11px;
    line-height:1.8;
  }

  .date-label {
    width:32px;
  }

  .tournament-link {
    margin-top:11px;
    font-size:10px;
  }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media (max-width:360px) {

  header {
    padding:0 10px;
  }

  .header-inner {
    grid-template-columns:34px minmax(0,1fr) auto;
  }

  .header-title h1 {
    font-size:21px;
  }

  .header-title .subtitle {
    font-size:7px;
  }

  .header-actions {
    gap:2px;
  }

  .menu-button {
    width:34px;
  }

  .menu-button span {
    left:6px;
  }

  .header-x {
    width:32px;
    height:32px;
  }

  .header-x svg {
    width:19px;
    height:19px;
  }


  .tournament-card {
    grid-template-columns:86px minmax(0,1fr);
    padding:13px 9px;
  }

  .tournament-logo {
    padding-right:10px;
  }

  .tournament-logo img {
    max-width:70px;
  }

  .tournament-info {
    padding-left:12px;
  }

  .tournament-info h3 {
    font-size:17px;
  }

  .tournament-date {
    font-size:10px;
  }

}
</style>
</head>


<body>


<!-- ==================================================
     ヘッダー
================================================== -->

<header>

      type="button"
      aria-label="メニューを開く"

    >
      <span></span>
      <span></span>
      <span></span>
    </button>


    <div class="header-title">

      <a href="/">

        </h1>

    <div class="header-actions">

      >

        <svg

        >
          <path

          />
        </svg>

    </div>

</header>


<!-- ==================================================
     展開メニュー
================================================== -->

<div
  class="menu-panel"
  id="menuPanel"
>

  <nav
    class="menu-nav"
    aria-label="サイトメニュー"
  >

    <a href="/">

    </a>

    <a href="/current/">

    </a>

    <a href="/archive/">

    </a>

    <a href="/#information">

    </a>

  </nav>

</div>


<!-- ==================================================
     メイン
================================================== -->

<main>


  <!-- ページタイトル -->

  <section class="page-heading">

    <p class="page-label">
      ― ARCHIVE ―
    </p>

    <h2>
      過去開催の大会
    </h2>

  </section>


  <!-- ==================================================
       大会一覧
  ================================================== -->

  <section class="archive-section">

    <div class="archive-list">


      <!-- =============================================

      ============================================== -->

      <a

            <br>

              本選
            </span>

            2026年10月11日(日) ～ 2026年10月25日(日)

          </p>


          <span class="tournament-link">

            <span

            >

            </span>

          </span>

      </a>


      <!--
      ==================================================

<!-- ==================================================
     フッター
================================================== -->

<footer>

  <p>
    伝承王 · Legend of GARDENER
  </p>

  <p>

    <a
      href="https://x.com/rxr_legendary"
      target="_blank"
      rel="noopener noreferrer"
    >
      運営Xアカウント
    </a>

  </p>

</footer>


<!-- ==================================================
     JavaScript
================================================== -->

<script>

const menuButton =
  document.getElementById("menuButton");

const menuPanel =
  document.getElementById("menuPanel");


function closeMenu() {

  menuPanel.classList.remove("open");
  menuButton.classList.remove("open");

  menuButton.setAttribute(
    "aria-expanded",
    "false"
  );

}


menuButton.addEventListener(
  "click",
  () => {

    const isOpen =
      menuPanel.classList.toggle("open");

    menuButton.classList.toggle(
      "open",
      isOpen
    );

    menuButton.setAttribute(
      "aria-expanded",
      String(isOpen)
    );

  }
);


menuPanel
  .querySelectorAll("a")
  .forEach(link => {

    link.addEventListener(
      "click",
      closeMenu
    );

  });


document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape") {
      closeMenu();
    }

  }
);

</script>


</body>
</html>
