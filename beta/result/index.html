<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff">

<title>集計結果 | 伝承王 -β-</title>
<link rel="icon" type="image/png" href="/beta/logo.png">

<style>
:root {
  --bg:#fff;
  --panel:#fff;
  --line:#e5e7eb;
  --text:#252a34;
  --muted:#737b89;
  --accent:#315dc8;
}

* { box-sizing:border-box; }
html { scrollbar-gutter:stable; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  position:relative;
  isolation:isolate;
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:url("/beta/background.png") center top / auto 100vh no-repeat;
  pointer-events:none;
}

/* ヘッダー */
header {
  height:100px;
  padding:0 32px;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.header-inner {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  width:min(1200px,100%);
  height:100%;
  margin:auto;
}

.header-title { text-align:center; }

.header-title h1 {
  margin:0;
  font-family:"Noto Serif JP","Yu Mincho",serif;
  font-size:36px;
  font-weight:700;
  line-height:1.3;
  letter-spacing:.12em;
}

.header-title .subtitle {
  margin-top:2px;
  color:var(--muted);
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:.12em;
}

/* メニューボタン */
.menu-button {
  justify-self:start;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:5px;
  width:44px;
  height:44px;
  padding:10px;
  border:0;
  background:transparent;
  cursor:pointer;
}

.menu-button span {
  width:22px;
  height:2px;
  background:#222;
}

/* HOME・X */
.header-actions {
  justify-self:end;
  display:flex;
  align-items:center;
  gap:12px;
}

.header-home,
.header-x {
  display:flex;
  align-items:center;
  justify-content:center;
  color:#111;
  text-decoration:none;
}

.header-home {
  flex-direction:column;
  gap:1px;
  width:44px;
  min-height:44px;
}

.header-home svg {
  width:21px;
  height:21px;
}

.header-home span {
  font-size:9px;
  line-height:1.2;
}

.header-x {
  width:42px;
  height:42px;
  border-radius:50%;
  transition:background .15s;
}

.header-x:hover { background:#f1f3f5; }

.header-x svg {
  width:25px;
  height:25px;
  fill:currentColor;
}

/* サイドメニュー */
.menu-overlay {
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgb(0 0 0 / 35%);
  opacity:0;
  visibility:hidden;
  transition:opacity .25s,visibility .25s;
}

.site-menu {
  position:fixed;
  inset:0 auto 0 0;
  z-index:1001;
  width:min(320px,85vw);
  padding:24px;
  background:#fff;
  box-shadow:4px 0 20px rgb(0 0 0 / 8%);
  transform:translateX(-105%);
  visibility:hidden;
  transition:transform .25s ease,visibility .25s;
}

.site-menu-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
  font-family:Georgia,serif;
  letter-spacing:.15em;
}

.site-menu-header button {
  border:0;
  background:transparent;
  color:#222;
  font-size:30px;
  cursor:pointer;
}

.site-menu > a {
  display:block;
  padding:15px 4px;
  border-bottom:1px solid var(--line);
  color:var(--text);
  text-decoration:none;
  font-size:14px;
}

.site-menu > a:hover { background:#f7f9fc; }

body.menu-open { overflow:hidden; }

body.menu-open .menu-overlay {
  opacity:1;
  visibility:visible;
}

body.menu-open .site-menu {
  transform:translateX(0);
  visibility:visible;
}

/* ページ */
.wrap {
  width:min(1000px,calc(100% - 32px));
  margin:auto;
}

main { padding:30px 0 56px; }

.card {
  min-width:0;
  padding:24px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
}

/* パンくず */
.breadcrumb {
  margin:0 0 14px;
  color:#7b8390;
  font-size:12px;
}

.breadcrumb a {
  color:#53647f;
  text-decoration:none;
}

.breadcrumb a:hover { text-decoration:underline; }

.breadcrumb span {
  margin:0 7px;
  color:#a0a6b0;
}

/* βロゴ */
.beta-logo {
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  margin:0 auto 32px;
}

.beta-logo img {
  display:block;
  width:min(520px,85%);
  height:auto;
  max-height:220px;
  object-fit:contain;
}

/* 集計結果見出し */
.results-heading {
  margin:0 0 26px;
  padding:24px 12px 28px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:center;
}

.results-heading h2 {
  margin:0;
  font-family:"Noto Serif JP","Yu Mincho",serif;
  font-size:clamp(25px,4vw,32px);
  font-weight:600;
  letter-spacing:.12em;
}

.results-period-label {
  margin:14px 0 2px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.08em;
}

.results-period {
  margin:0;
  font-size:14px;
}

/* タブ */
.tabs {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  width:100%;
  margin:0;
  padding:0;
  border:1px solid var(--accent);
  border-radius:6px;
  overflow:hidden;
}

.tab {
  width:100%;
  min-width:0;
  margin:0;
  padding:11px 6px;
  border:0;
  border-right:1px solid var(--accent);
  background:#fff;
  color:var(--accent);
  font-size:14px;
  text-align:center;
  cursor:pointer;
}

.tab:last-child { border-right:0; }

.tab.active {
  background:var(--accent);
  color:#fff;
  font-weight:700;
}

.tab:hover:not(.active) { background:#edf3ff; }
[hidden] { display:none !important; }

/* 予選・本選 */
.stage-frame {
  width:100%;
  padding-bottom:24px;
  border:1px solid var(--accent);
  border-radius:8px;
  background:#fff;
  overflow:hidden;
}

.stage-tabs {
  grid-template-columns:repeat(2,minmax(0,1fr));
  border:0;
  border-bottom:1px solid var(--accent);
  border-radius:0;
}

.stage-tabs .tab {
  padding:12px 6px;
  font-size:15px;
}

/* ブロック */
.block-frame {
  width:95%;
  margin:22px auto 0;
  padding:12px;
  border:1px solid var(--accent);
  border-radius:7px;
  background:#fff;
}

/* 階層 */
.category-frame {
  width:90%;
  margin:20px auto 0;
  border:1px solid var(--accent);
  border-radius:7px;
  background:#fff;
  overflow:hidden;
}

#categoryTabs {
  border:0;
  border-bottom:1px solid var(--accent);
  border-radius:0;
}

#categoryTabs .tab {
  padding:10px 4px;
  font-size:13px;
}

/* ランキング */
.ranking-panel {
  width:100%;
  padding:20px;
  background:#fff;
}

.table-wrap {
  width:100%;
  max-width:680px;
  margin:auto;
  overflow-x:auto;
}

table {
  width:100%;
  table-layout:fixed;
  border-collapse:collapse;
}

.rank-col { width:20%; }
.id-col,.time-col { width:40%; }

thead { background:#f5f7fa; }

th,td {
  padding:15px 8px;
  border-bottom:1px solid var(--line);
  text-align:center;
  overflow-wrap:anywhere;
}

th {
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
}

td {
  color:#303642;
  font-size:14px;
}

td:first-child { font-weight:700; }

td:last-child {
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* 上位3位 */
tbody tr.rank-1 { background:#fff8e6; }
tbody tr.rank-2 { background:#f4f6f8; }
tbody tr.rank-3 { background:#fff3ec; }

tbody tr.rank-1 td:first-child { color:#a97918; }
tbody tr.rank-2 td:first-child { color:#707985; }
tbody tr.rank-3 td:first-child { color:#a86b46; }

tbody tr.rank-1:hover { background:#fff1c9; }
tbody tr.rank-2:hover { background:#e9edf2; }
tbody tr.rank-3:hover { background:#ffe8d9; }
tbody tr:hover { background:#f7f9fc; }

.empty {
  padding:36px 10px;
  color:var(--muted);
  text-align:center;
  overflow-wrap:normal;
}

#updated {
  max-width:680px;
  margin:20px auto 0;
  color:#858b96;
  font-size:11px;
  text-align:right;
}

/* フッター */
footer {
  padding:22px 16px;
  border-top:1px solid var(--line);
  color:#858b96;
  font-size:11px;
  text-align:center;
}

/* スマートフォン */
@media (max-width:600px) {
  header {
    height:78px;
    padding:0 14px;
  }

  .header-inner {
    grid-template-columns:36px minmax(0,1fr) auto;
  }

  .header-title h1 { font-size:25px; }

  .header-title .subtitle {
    font-size:8px;
    letter-spacing:.04em;
  }

  .menu-button {
    width:36px;
    height:36px;
    padding:7px;
  }

  .header-actions { gap:5px; }
  .header-home { width:36px; }

  .header-home svg {
    width:19px;
    height:19px;
  }

  .header-x {
    width:32px;
    height:36px;
  }

  .header-x svg {
    width:20px;
    height:20px;
  }

  .wrap { width:calc(100% - 20px); }
  main { padding:18px 0 38px; }

  .card {
    padding:16px 10px;
    border-radius:10px;
  }

  .breadcrumb {
    margin-bottom:10px;
    font-size:11px;
  }

  .beta-logo { margin-bottom:24px; }

  .beta-logo img {
    width:90%;
    max-height:160px;
  }

  .results-heading {
    margin-bottom:18px;
    padding:20px 6px 22px;
  }

  .results-period { font-size:12px; }

  .stage-frame { padding-bottom:14px; }

  .stage-tabs .tab {
    padding:11px 4px;
    font-size:13px;
  }

  .block-frame {
    width:96%;
    margin-top:14px;
    padding:7px;
  }

  #blockTabs .tab {
    padding:10px 2px;
    font-size:12px;
  }

  .category-frame {
    width:94%;
    margin-top:14px;
  }

  #categoryTabs .tab {
    padding:9px 2px;
    font-size:11px;
    overflow-wrap:anywhere;
  }

  .ranking-panel { padding:12px 8px; }

  th,td { padding:13px 3px; }

  th {
    font-size:11px;
    letter-spacing:0;
  }

  td { font-size:13px; }

  #updated {
    margin-top:16px;
    font-size:10px;
  }
}

@media (max-width:360px) {
  .header-inner {
    grid-template-columns:30px minmax(0,1fr) auto;
  }

  .header-title h1 { font-size:21px; }
  .header-title .subtitle { font-size:7px; }
  .header-actions { gap:2px; }

  .card {
    padding-right:7px;
    padding-left:7px;
  }

  .block-frame { padding:5px; }

  .ranking-panel {
    padding-right:6px;
    padding-left:6px;
  }

  th,td {
    padding-right:2px;
    padding-left:2px;
  }

  td { font-size:12px; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <button class="menu-button" id="menu-open" type="button"
      aria-label="メニューを開く" aria-controls="site-menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="header-title">
      <h1>伝承王</h1>
      <div class="subtitle">Legend of GARDENER</div>
    </div>

    <div class="header-actions">
      <a class="header-home" href="/" aria-label="HOME">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"
            fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>HOME</span>
      </a>

      <a class="header-x" href="https://x.com/rxr_legendary"
        target="_blank" rel="noopener noreferrer"
        aria-label="伝承王の運営アカウントをXで開く">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.657l-5.214-6.817-5.97 6.817H1.676l7.73-8.835L1.25 2.25h6.826l4.713 6.231zm-1.161 17.52h1.833L7.01 4.126H5.044z"/>
        </svg>
      </a>
    </div>
  </div>
</header>

<div class="menu-overlay" id="menu-overlay"></div>

<nav class="site-menu" id="site-menu" aria-label="サイトメニュー" aria-hidden="true">
  <div class="site-menu-header">
    <span>MENU</span>
    <button id="menu-close" type="button" aria-label="メニューを閉じる">×</button>
  </div>

  <a href="/">HOME</a>
  <a href="/beta/">開催中の大会</a>
  <a href="/archive/">過去開催の大会</a>
  <a href="/#information">お問い合わせ</a>
</nav>

<main class="wrap">
<section class="card">

  <nav class="breadcrumb" aria-label="パンくずリスト">
    <a href="/">HOME</a>
    <span>›</span>
    <a href="/beta/">伝承王β</a>
    <span>›</span>
    集計結果
  </nav>

  <div class="beta-logo">
    <img src="/beta/logo.png" alt="伝承王β">
  </div>

  <div class="results-heading">
    <h2>集計結果</h2>
    <p class="results-period-label">開催期間</p>
    <p class="results-period">
      2026年10月11日(日) ～ 2026年10月25日(日)
    </p>
  </div>

  <!-- 予選・本選 -->
  <div class="stage-frame">
    <div class="tabs stage-tabs" id="stageTabs" aria-label="大会日程選択">
      <button class="tab" data-stage="prelim">予選</button>
      <button class="tab active" data-stage="main">本選</button>
    </div>

    <div id="mainRanking">

      <!-- ブロック -->
      <div class="block-frame">
        <div class="tabs" id="blockTabs" aria-label="ブロック選択">
          <button class="tab active" data-block="A">Aブロック</button>
          <button class="tab" data-block="B">Bブロック</button>
          <button class="tab" data-block="C">Cブロック</button>
          <button class="tab" data-block="D">Dブロック</button>
        </div>

        <!-- 階層 -->
        <div class="category-frame">
          <div class="tabs" id="categoryTabs" aria-label="階層選択">
            <button class="tab active" data-category="total">総合</button>
            <button class="tab" data-category="reverse">リバースバベル</button>
            <button class="tab" data-category="another">アナザーバベル</button>
            <button class="tab" data-category="rebuild">バベルリビルド</button>
          </div>

          <!-- ランキング -->
          <div class="ranking-panel">
            <div class="table-wrap">
              <table>
                <colgroup>
                  <col class="rank-col">
                  <col class="id-col">
                  <col class="time-col">
                </colgroup>

                <thead>
                  <tr>
                    <th>順位</th>
                    <th>固有番号</th>
                    <th>残りタイム</th>
                  </tr>
                </thead>

                <tbody id="rankingBody">
                  <tr>
                    <td colspan="3" class="empty">
                      ランキングデータを読み込み中…
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div id="updated">データ更新時刻：確認中</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</section>
</main>

<footer>伝承王</footer>

<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbxOK5iDKjdWnx8Y9iabdSlj_Q8Bqjovve2V1bMMrYM2uOmDhAvqxi5YW93Nu3-rer6Q0w/exec";

const $ = id => document.getElementById(id);
const rankingBody = $("rankingBody");
const updated = $("updated");
const mainRanking = $("mainRanking");

let rankingData;
let currentStage = "main";
let currentBlock = "A";
let currentCategory = "total";
let isLoading = false;
let requestId = 0;

/* ランキング取得 */
function loadRanking() {
  if (isLoading) return;

  isLoading = true;
  const id = ++requestId;
  const script = document.createElement("script");
  const callback = "receiveRankingData";
  let finished = false;

  const cleanup = () => {
    if (finished) return;
    finished = true;
    clearTimeout(timeout);
    delete window[callback];
    script.remove();
    isLoading = false;
  };

  const error = () => {
    if (finished) return;
    cleanup();

    if (currentStage === "prelim") return;

    if (rankingData) {
      updated.textContent = "更新に失敗しました。前回のデータを表示中です。";
    } else {
      rankingBody.innerHTML =
        '<tr><td colspan="3" class="empty">データの取得に失敗しました。ページを再読み込みしてください。</td></tr>';
      updated.textContent = "";
    }
  };

  const timeout = setTimeout(error,20000);

  window[callback] = data => {
    if (finished || id !== requestId) return;
    if (!data?.blocks || data.error) return error();

    rankingData = data;
    cleanup();
    renderRanking();
  };

  script.onerror = error;

  const cacheKey = Math.floor(Date.now() / 300000);
  script.src = `${API_URL}?callback=${callback}&v=${cacheKey}`;
  document.head.appendChild(script);
}

/* ランキング描画 */
function renderRanking() {
  document.querySelectorAll("[data-stage]").forEach(btn =>
    btn.classList.toggle("active",btn.dataset.stage === currentStage)
  );

  if (currentStage === "prelim") {
    mainRanking.hidden = true;
    rankingBody.innerHTML =
      '<tr><td colspan="3" class="empty">予選ランキングは準備中です。</td></tr>';
    updated.textContent = "";
    return;
  }

  mainRanking.hidden = false;
  if (!rankingData?.blocks) return;

  const available = rankingData.blocks[currentBlock];
  if (!available) return;

  if (!(currentCategory in available)) currentCategory = "total";

  document.querySelectorAll("[data-block]").forEach(btn =>
    btn.classList.toggle("active",btn.dataset.block === currentBlock)
  );

  document.querySelectorAll("[data-category]").forEach(btn => {
    const category = btn.dataset.category;
    btn.hidden = !(category in available);
    btn.classList.toggle("active",category === currentCategory);
  });

  const entries = available[currentCategory] || [];

  if (!entries.length) {
    rankingBody.innerHTML =
      '<tr><td colspan="3" class="empty">現在、記録はありません。</td></tr>';
  } else {
    let previousTime = null;
    let previousRank = 0;

    rankingBody.innerHTML = entries.map((entry,index) => {
      const time = Number(entry.time);
      const rounded = Math.round(time * 100) / 100;
      const rank =
        index && rounded === previousTime ? previousRank : index + 1;

      previousTime = rounded;
      previousRank = rank;

      return `
        <tr class="${rank <= 3 ? `rank-${rank}` : ""}">
          <td>${rank}位</td>
          <td>${escapeHTML(String(entry.id))}</td>
          <td>${time.toFixed(2)}秒</td>
        </tr>`;
    }).join("");
  }

  const date = new Date(rankingData.updatedAt);

  updated.textContent =
    "データ更新時刻：" +
    (Number.isNaN(date.getTime())
      ? "不明"
      : date.toLocaleString("ja-JP",{timeZone:"Asia/Tokyo"}) + "（日本時間）");
}

function escapeHTML(str) {
  return str.replace(/[&<>"']/g,c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

/* タブ */
$("stageTabs").onclick = e => {
  const btn = e.target.closest("[data-stage]");
  if (!btn) return;
  currentStage = btn.dataset.stage;
  renderRanking();
};

$("blockTabs").onclick = e => {
  const btn = e.target.closest("[data-block]");
  if (!btn) return;
  currentBlock = btn.dataset.block;
  renderRanking();
};

$("categoryTabs").onclick = e => {
  const btn = e.target.closest("[data-category]");
  if (!btn || btn.hidden) return;
  currentCategory = btn.dataset.category;
  renderRanking();
};

/* メニュー */
const menuOpen = $("menu-open");
const menu = $("site-menu");

function toggleMenu(open) {
  document.body.classList.toggle("menu-open",open);
  menuOpen.setAttribute("aria-expanded",open);
  menu.setAttribute("aria-hidden",!open);
}

menuOpen.onclick = () => toggleMenu(true);
$("menu-close").onclick = $("menu-overlay").onclick = () => toggleMenu(false);
menu.querySelectorAll("a").forEach(a => a.onclick = () => toggleMenu(false));
document.addEventListener("keydown",e => e.key === "Escape" && toggleMenu(false));

/* 初回取得・5分ごとに更新 */
loadRanking();
setInterval(loadRanking,300000);
</script>

</body>
</html>
