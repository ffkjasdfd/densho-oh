
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>伝承王</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --panel: #141d31;
  --panel2: #1b2740;
  --line: #2b3955;
  --text: #edf2ff;
  --muted: #a2afc9;
  --accent: #86b7ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  padding: 28px 18px 22px;
  border-bottom: 1px solid var(--line);
  background: #10182a;
}
.wrap { width: min(960px, 100% - 28px); margin: auto; }
.brand { color: var(--accent); font-size: 13px; letter-spacing: .2em; }
h1 { margin: 8px 0 4px; font-size: clamp(28px, 6vw, 42px); }
.subtitle { color: var(--muted); font-size: 14px; }
main { padding: 24px 0 50px; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
}
h2 { margin: 0 0 6px; font-size: 23px; }
.description { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
.tab {
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--text);
  border-radius: 9px;
  padding: 10px 15px;
  font-size: 14px;
  cursor: pointer;
}
.tab.active {
  background: #29446b;
  border-color: var(--accent);
  color: white;
}
.status { color: var(--muted); font-size: 13px; margin: 12px 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 300px; }
th, td {
  padding: 13px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
}
th { color: var(--muted); font-size: 12px; font-weight: 600; }
td { font-size: 14px; }
td:first-child { width: 72px; font-weight: 700; }
td:last-child, th:last-child {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
tbody tr:nth-child(-n+3) td:first-child { color: var(--accent); }
.empty { color: var(--muted); text-align: center !important; padding: 30px 10px; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 20px; }
@media (max-width: 480px) {
  .card { padding: 14px; }
  .tab { padding: 9px 12px; }
  th, td { padding: 12px 8px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">D E N S H O U - O U</div>
    <h1>伝承王</h1>
    <div class="subtitle">リバースブルー×リバースエンド 非公式大会ランキング</div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h2>伝承王β</h2>
    <div class="description">本戦ランキング</div>

    <div class="tabs" id="blockTabs" aria-label="ブロック選択">
      <button class="tab active" data-block="A">Aブロック</button>
      <button class="tab" data-block="B">Bブロック</button>
      <button class="tab" data-block="C">Cブロック</button>
      <button class="tab" data-block="D">Dブロック</button>
    </div>

    <div class="tabs" id="categoryTabs" aria-label="階層選択">
      <button class="tab active" data-category="total">総合</button>
      <button class="tab" data-category="reverse">リバースバベル</button>
      <button class="tab" data-category="another">アナザーバベル</button>
      <button class="tab" data-category="rebuild">バベルリビルド</button>
    </div>

    <div id="status" class="status" role="status">ランキングデータを読み込み中…</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>順位</th>
            <th>固有番号</th>
            <th>残りタイム</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
          <tr><td colspan="3" class="empty">読み込み中…</td></tr>
        </tbody>
      </table>
    </div>
    <div id="updated" class="status">最終更新：確認中</div>
  </section>
</main>

<footer>伝承王β · 非公式ファン大会</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw1z7lljuIWST1ibBa0NZzH4__VTNh1PAhaRkS2lWKuu4iKezHOz66RH4UzVZJqNCE5Tw/exec";

let rankingData = null;
let currentBlock = "A";
let currentCategory = "total";

const categoryNames = {
  total: "総合",
  reverse: "リバースバベル",
  another: "アナザーバベル",
  rebuild: "バベルリビルド"
};


let isLoading = false;
let requestId = 0;

function loadRanking() {
  // 前の通信が終わっていなければ、重複して読み込まない
  if (isLoading) return;

  isLoading = true;
  const thisRequest = ++requestId;

  const script = document.createElement("script");
  const callbackName = "receiveRankingData";

  let finished = false;
  const timeoutId = setTimeout(() => {
    finishWithError();
  }, 20000);

  function cleanup() {
    if (finished) return;
    finished = true;
    clearTimeout(timeoutId);
    delete window[callbackName];
    script.remove();
    isLoading = false;
  }

  function finishWithError() {
    if (finished) return;
    cleanup();

    // 既に表示されているランキングは消さない
    document.getElementById("status").textContent =
      rankingData
        ? "更新に失敗しました。前回のデータを表示中です。次回の更新をお待ちください。"
        : "ランキングを読み込めませんでした。ページを再読み込みしてください。";

    if (!rankingData) {
      document.getElementById("rankingBody").innerHTML =
        '<tr><td colspan="3" class="empty">データの取得に失敗しました。</td></tr>';
    }
  }

  window[callbackName] = function(data) {
    if (finished || thisRequest !== requestId) return;

    if (!data || !data.blocks || data.error) {
      finishWithError();
      return;
    }

    rankingData = data;
    cleanup();
    renderRanking();
  };

  script.onerror = finishWithError;

  script.src = API_URL + "?callback=" + callbackName +
    "&_=" + Date.now();

  document.head.appendChild(script);
}

function renderRanking() {
  if (!rankingData || !rankingData.blocks) return;

  const available = rankingData.blocks[currentBlock];
  if (!available) return;

  if (!Object.prototype.hasOwnProperty.call(available, currentCategory)) {
    currentCategory = "total";
  }

  document.querySelectorAll("[data-block]").forEach(button => {
    button.classList.toggle("active", button.dataset.block === currentBlock);
  });

  document.querySelectorAll("[data-category]").forEach(button => {
    const category = button.dataset.category;
    const supported = Object.prototype.hasOwnProperty.call(available, category);
    button.hidden = !supported;
    button.classList.toggle("active", category === currentCategory);
  });

  const entries = available[currentCategory] || [];
  const tbody = document.getElementById("rankingBody");

  if (entries.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty">現在、記録はありません。</td></tr>';
  } else {
    let previousTime = null;
    let previousRank = 0;

    tbody.innerHTML = entries.map((entry, index) => {
      const time = Number(entry.time);
      const roundedTime = Math.round(time * 100) / 100;

      // 表示上同じ残りタイムなら同率順位にする
      const rank = index > 0 && roundedTime === previousTime
        ? previousRank
        : index + 1;

      previousTime = roundedTime;
      previousRank = rank;

      return `<tr>
        <td>${rank}位</td>
        <td>${escapeHTML(String(entry.id))}</td>
        <td>${time.toFixed(2)}秒</td>
      </tr>`;
    }).join("");
  }

  document.getElementById("status").textContent =
    currentBlock + "ブロック / " + categoryNames[currentCategory] +
    " / " + entries.length + "件";

  const date = new Date(rankingData.updatedAt);
  document.getElementById("updated").textContent =
    "データ更新時刻： " +
    (Number.isNaN(date.getTime())
      ? "不明"
      : date.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" }) + "（日本時間）");
}

function escapeHTML(value) {
  return value.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

document.getElementById("blockTabs").addEventListener("click", event => {
  const button = event.target.closest("[data-block]");
  if (!button) return;
  currentBlock = button.dataset.block;
  renderRanking();
});

document.getElementById("categoryTabs").addEventListener("click", event => {
  const button = event.target.closest("[data-category]");
  if (!button || button.hidden) return;
  currentCategory = button.dataset.category;
  renderRanking();
});

loadRanking();
setInterval(loadRanking, 5 * 60 * 1000);
</script>
</body>
</html>
