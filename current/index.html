<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff">

<title>開催中の大会 | 伝承王</title>
<meta name="description" content="伝承王で現在開催中の大会">
<link rel="icon" type="image/png" href="/logo.png">

<style>
:root {
  --bg:#fff;
  --text:#202020;
  --muted:#777;
  --line:#e5e5e5;
  --soft:#f8f8f8;
}

* {
  box-sizing:border-box;
}

html {
  scrollbar-gutter:stable;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  line-height:1.9;
}


/* ==================================================
   ヘッダー
================================================== */

header {
  position:sticky;
  top:0;
  z-index:20;
  height:100px;
  padding:0 32px;
  background:rgba(255,255,255,.98);
  border-bottom:1px solid var(--line);
}

.header-inner {
  position:relative;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  width:min(1200px,100%);
  height:100%;
  margin:auto;
}

.header-title {
  min-width:0;
  text-align:center;
}

.header-title a {
  color:inherit;
  text-decoration:none;
}

.header-title h1 {
  margin:0;
  font-family:"Yu Mincho","Noto Serif JP",serif;
  font-size:34px;
  line-height:1.3;
  letter-spacing:.12em;
}

.header-title .subtitle {
  color:var(--muted);
  font-family:Georgia,serif;
  font-size:11px;
  line-height:1.5;
  letter-spacing:.12em;
}


/* ==================================================
   メニューボタン
================================================== */

.menu-button {
  justify-self:start;
  position:relative;
  width:44px;
  height:44px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}

.menu-button span {
  position:absolute;
  left:11px;
  width:22px;
  height:2px;
  background:#222;
  transition:
    transform .2s ease,
    opacity .2s ease,
    top .2s ease;
}

.menu-button span:nth-child(1) {
  top:14px;
}

.menu-button span:nth-child(2) {
  top:21px;
}

.menu-button span:nth-child(3) {
  top:28px;
}

.menu-button.open span:nth-child(1) {
  top:21px;
  transform:rotate(45deg);
}

.menu-button.open span:nth-child(2) {
  opacity:0;
}

.menu-button.open span:nth-child(3) {
  top:21px;
  transform:rotate(-45deg);
}


/* ==================================================
   HOME・X
================================================== */

.header-actions {
  justify-self:end;
  display:flex;
  align-items:center;
  gap:12px;
}

.header-home {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  width:44px;
  min-height:44px;
  color:#111;
  text-decoration:none;
}

.header-home svg {
  width:21px;
  height:21px;
}

.header-home span {
  font-size:9px;
  line-height:1.2;
}

.header-x {
  display:flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  color:#111;
  text-decoration:none;
}

.header-x svg {
  display:block;
  width:24px;
  height:24px;
  fill:currentColor;
}


/* ==================================================
   展開メニュー
================================================== */

.menu-panel {
  position:fixed;
  top:100px;
  left:0;
  z-index:19;
  width:100%;
  padding:30px 70px;
  background:rgba(255,255,255,.98);
  border-top:1px solid #eee;
  box-shadow:0 10px 25px rgba(0,0,0,.08);

  opacity:0;
  visibility:hidden;
  transform:translateY(-10px);

  transition:
    opacity .2s ease,
    transform .2s ease,
    visibility .2s;
}

.menu-panel.open {
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.menu-nav {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  max-width:1180px;
  margin:0 auto;
}

.menu-nav a {
  padding:15px 12px;
  border-bottom:1px solid var(--line);
  color:var(--text);
  text-align:center;
  text-decoration:none;
  font-size:14px;
}

.menu-nav a:hover {
  color:#777;
}


/* ==================================================
   メイン
================================================== */

main {
  min-height:calc(100vh - 100px);
}

.page-heading {
  display:flex;
  min-height:310px;
  padding:70px 24px;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--line);
  text-align:center;
}

.page-label {
  margin:0 0 7px;
  color:var(--muted);
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:.18em;
}

.page-heading h2 {
  margin:0;
  font-family:"Yu Mincho","Noto Serif JP",serif;
  font-size:clamp(28px,5vw,38px);
  font-weight:500;
  letter-spacing:.12em;
}


/* ==================================================
   開催状況
================================================== */

.current-section {
  width:min(880px,calc(100% - 40px));
  margin:auto;
  padding:100px 0 120px;
  text-align:center;
}

.empty-title {
  margin:0;
  font-family:"Yu Mincho","Noto Serif JP",serif;
  font-size:22px;
  font-weight:500;
  letter-spacing:.06em;
}

.empty-rule {
  width:34px;
  height:1px;
  margin:28px auto;
  background:#aaa;
}

.empty-description {
  margin:0;
  color:#777;
  font-size:14px;
  line-height:2;
}

.archive-link {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:210px;
  margin-top:36px;
  padding:11px 22px;
  border:1px solid #555;
  background:#fff;
  color:var(--text);
  font-size:12px;
  text-decoration:none;
  transition:
    background .2s,
    color .2s;
}

.archive-link:hover {
  background:#222;
  color:#fff;
}

.archive-link-arrow {
  display:inline-block;
  margin-left:8px;
  transition:transform .2s;
}

.archive-link:hover .archive-link-arrow {
  transform:translateX(4px);
}


/* ==================================================
   フッター
================================================== */

footer {
  padding:30px 20px;
  border-top:1px solid var(--line);
  color:var(--muted);
  text-align:center;
  font-size:11px;
}

footer p {
  margin:4px 0;
}

footer a {
  color:inherit;
  text-decoration:none;
}

footer a:hover {
  color:var(--text);
}


/* ==================================================
   スマートフォン
================================================== */

@media (max-width:600px) {

  header {
    height:78px;
    padding:0 14px;
  }

  .header-inner {
    grid-template-columns:44px minmax(0,1fr) auto;
  }

  .header-title h1 {
    font-size:25px;
    letter-spacing:.08em;
  }

  .header-title .subtitle {
    font-size:8px;
    letter-spacing:.04em;
  }

  .menu-button {
    width:36px;
    height:36px;
  }

  .menu-button span {
    left:7px;
  }

  .menu-button span:nth-child(1) {
    top:11px;
  }

  .menu-button span:nth-child(2) {
    top:17px;
  }

  .menu-button span:nth-child(3) {
    top:23px;
  }

  .menu-button.open span:nth-child(1) {
    top:17px;
  }

  .menu-button.open span:nth-child(3) {
    top:17px;
  }

  .header-actions {
    gap:5px;
  }

  .header-home {
    width:36px;
    min-height:36px;
  }

  .header-home svg {
    width:19px;
    height:19px;
  }

  .header-x {
    width:32px;
    height:36px;
  }

  .header-x svg {
    width:20px;
    height:20px;
  }


  /* メニュー */

  .menu-panel {
    top:78px;
    padding:20px;
  }

  .menu-nav {
    grid-template-columns:1fr;
    gap:0;
  }

  .menu-nav a {
    padding:14px 8px;
    font-size:13px;
  }


  /* 本文 */

  main {
    min-height:calc(100vh - 78px);
  }

  .page-heading {
    min-height:240px;
    padding:55px 20px;
  }

  .page-label {
    font-size:10px;
  }

  .current-section {
    width:calc(100% - 32px);
    padding:75px 0 90px;
  }

  .empty-title {
    font-size:19px;
  }

  .empty-description {
    font-size:13px;
  }

  .archive-link {
    min-width:190px;
    margin-top:30px;
    padding:10px 18px;
  }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media (max-width:360px) {

  header {
    padding:0 10px;
  }

  .header-inner {
    grid-template-columns:34px minmax(0,1fr) auto;
  }

  .header-title h1 {
    font-size:21px;
  }

  .header-title .subtitle {
    font-size:7px;
  }

  .header-actions {
    gap:2px;
  }

  .menu-button {
    width:34px;
  }

  .menu-button span {
    left:6px;
  }

  .header-x {
    width:32px;
    height:32px;
  }

  .header-x svg {
    width:19px;
    height:19px;
  }

}
</style>
</head>


<body>


<!-- ==================================================
     ヘッダー
================================================== -->

<header>

  <div class="header-inner">

    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-label="メニューを開く"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>


    <div class="header-title">

      <a href="/">

        <h1>
          伝承王
        </h1>

        <div class="subtitle">
          Legend of GARDENER
        </div>

      </a>

    </div>


    <div class="header-actions">

      <a
        class="header-home"
        href="/"
        aria-label="HOME"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
        </svg>

        <span>
          HOME
        </span>

      </a>


      <a
        class="header-x"
        href="https://x.com/rxr_legendary"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="伝承王のXアカウント"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.657l-5.214-6.817-5.97 6.817H1.676l7.73-8.835L1.25 2.25h6.826l4.713 6.231zm-1.161 17.52h1.833L7.01 4.126H5.044z"
          />
        </svg>

      </a>

    </div>

  </div>

</header>


<!-- ==================================================
     メニュー
================================================== -->

<div
  class="menu-panel"
  id="menuPanel"
>

  <nav
    class="menu-nav"
    aria-label="サイトメニュー"
  >

    <a href="/">
      HOME
    </a>

    <a href="/current/">
      開催中の大会
    </a>

    <a href="/archive/">
      過去開催の大会
    </a>

    <a href="/#information">
      お問い合わせ
    </a>

  </nav>

</div>


<!-- ==================================================
     メイン
================================================== -->

<main>


  <!-- ページタイトル -->

  <section class="page-heading">

    <p class="page-label">
      ― TOURNAMENTS ―
    </p>

    <h2>
      開催中の大会
    </h2>

  </section>


  <!-- 開催状況 -->

  <section class="current-section">

    <h3 class="empty-title">
      現在開催中の大会はありません。
    </h3>

    <div class="empty-rule"></div>

    <p class="empty-description">
      過去に開催された大会については、<br>
      「過去開催の大会」からご覧いただけます。
    </p>


    <a
      class="archive-link"
      href="/archive/"
    >
      過去開催の大会を見る

      <span
        class="archive-link-arrow"
        aria-hidden="true"
      >
        →
      </span>
    </a>

  </section>


</main>


<!-- ==================================================
     フッター
================================================== -->

<footer>

  <p>
    伝承王 · Legend of GARDENER
  </p>

  <p>

    <a
      href="https://x.com/rxr_legendary"
      target="_blank"
      rel="noopener noreferrer"
    >
      運営Xアカウント
    </a>

  </p>

</footer>


<!-- ==================================================
     JavaScript
================================================== -->

<script>

const menuButton =
  document.getElementById("menuButton");

const menuPanel =
  document.getElementById("menuPanel");


function closeMenu() {

  menuPanel.classList.remove("open");
  menuButton.classList.remove("open");

  menuButton.setAttribute(
    "aria-expanded",
    "false"
  );

}


menuButton.addEventListener(
  "click",
  () => {

    const isOpen =
      menuPanel.classList.toggle("open");

    menuButton.classList.toggle(
      "open",
      isOpen
    );

    menuButton.setAttribute(
      "aria-expanded",
      String(isOpen)
    );

  }
);


menuPanel
  .querySelectorAll("a")
  .forEach(link => {

    link.addEventListener(
      "click",
      closeMenu
    );

  });


document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape") {
      closeMenu();
    }

  }
);

</script>


</body>
</html>
